<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConfiDBA Studio</title>
<style>
:root{--ink:#10202C;--bg:#F1F5F8;--tl:#0E7C86;--tl2:#0A5A63;--rd:#C8432F;--am:#D9A21B;--gr:#2F8F5B;--mu:#5B6C78;--ln:#DCE4EA;--sh:0 2px 10px rgba(16,32,44,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 "Segoe UI",system-ui,sans-serif}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:linear-gradient(170deg,#10202C,#0B3A44);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{font-size:21px;font-weight:700;letter-spacing:-.01em;padding:0 8px}.logo small{display:block;font-size:11.5px;font-weight:400;color:#9DB6BE}
aside select{margin:12px 0 6px;background:#ffffff14;color:#fff;border-color:#ffffff30}aside select option{color:#10202C}
.nav{background:none;border:0;color:#C5D6DB;text-align:left;padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer;width:100%}
.nav:hover{background:#ffffff12}.nav.on{background:#ffffff22;color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #3FD0DC}
.who{margin-top:auto;font-size:13px;color:#9DB6BE;padding:8px;word-break:break-all}
main{padding:26px clamp(16px,3vw,40px) 60px;max-width:1180px;width:100%}
h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}h2{margin:0 0 8px;font-size:18px}.sub{color:var(--mu);margin:0 0 18px}
.card{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}.g2>.card{margin:0}
label{display:block;font-size:13px;color:var(--mu);margin-top:10px}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--ln);border-radius:8px;width:100%;background:#fff}input[type=radio]{width:auto}
button{background:var(--tl);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer;font-weight:600}button:hover{background:var(--tl2)}button.g{background:#fff;color:var(--ink);border:1px solid var(--ln)}button:disabled{opacity:.6}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--am);outline-offset:1px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:140px}.row>button{flex:0 0 auto}
.pill{display:inline-block;color:#fff;border-radius:20px;padding:2px 12px;font-size:13px;font-weight:700}
td select{min-width:150px}table{border-collapse:collapse;width:100%}th,td{padding:9px 10px;border-bottom:1px solid var(--ln);text-align:left;font-size:14px;vertical-align:top}th{background:#F5F8FA;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--mu)}.w{overflow-x:auto}
pre{margin:6px 0;white-space:pre-wrap;word-break:break-word;background:#0F1E29;color:#D6E8EE;padding:12px;border-radius:10px;font:12.5px Consolas,monospace}
.bar{height:9px;background:#E6ECF0;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px}
.stat{text-align:center}.stat b{font-size:30px;display:block;line-height:1.1}.stat span{font-size:13px;color:var(--mu)}
.err{color:var(--rd);font-weight:600}.ok{color:var(--gr);font-weight:600}.note{background:#FFF6DC;border:1px solid #EBCB75;padding:9px 13px;border-radius:10px;font-size:14px;margin-bottom:14px}
.help{background:#E8F4F6;border-left:4px solid var(--tl);padding:10px 14px;border-radius:8px;font-size:14px;color:#23424A;margin:10px 0}
.tabs{display:flex;background:#EAF0F3;border-radius:10px;padding:4px;margin-bottom:12px}.tabs button{flex:1;background:none;color:var(--mu)}.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}.brand{background:linear-gradient(150deg,#10202C,#0E7C86);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:center}
.brand h1{font-size:40px;color:#fff}.brand p{color:#CFE5E9;max-width:44ch;font-size:17px}.brand li{margin:6px 0;color:#CFE5E9}.form{display:flex;align-items:center;justify-content:center;padding:30px}.form>div{width:100%;max-width:380px}
.step{display:flex;gap:12px;margin:10px 0}.step b{flex:0 0 30px;height:30px;border-radius:50%;background:var(--tl);color:#fff;display:flex;align-items:center;justify-content:center}
.cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;gap:2px;flex-wrap:wrap}
@media(max-width:860px){.app,.auth{grid-template-columns:1fr}aside{position:static;height:auto}.brand{padding:30px}}
@media print{aside,.noprint,button,select,input{display:none!important}.app{display:block}body{background:#fff}.card{box-shadow:none}}
</style></head><body><div id="r"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(u,m='GET',b)=>{const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Error '+r.status));return j};
const Z=p=>p==null?['Sin datos','#8A98A3']:p>=70?['Verde','#2F8F5B']:p>=30?['Amarillo','#D9A21B']:['Rojo','#C8432F'];
let S={me:null,emps:[],eid:null,evs:[],ev:null,cat:null,v:'resumen',msg:'',modo:'login',open:{},busy:false,conn:''};
const emp=()=>S.emps.find(e=>e.id==S.eid);
async function boot(){try{S.me=(await api('/api/me')).email}catch(e){}if(S.me)await load();draw()}
async function load(){S.cat=await api('/api/catalogo');S.emps=await api('/api/empresas');if(!S.emps.length)S.v='empresa';else if(!S.eid||!emp())S.eid=S.emps[0].id;await loadEvs()}
async function loadEvs(){S.evs=S.eid?await api(`/api/empresas/${S.eid}/evals`):[];S.ev=S.evs.length?await api('/api/evals/'+S.evs[S.evs.length-1].id):null}
const go=v=>{S.v=v;S.msg='';draw();scrollTo(0,0)};
function draw(){$('#r').innerHTML=S.me?shell():authV()}
/* ---------- acceso ---------- */
const authV=()=>`<div class="auth"><div class="brand"><h1>ConfiDBA Studio</h1><p>Mida qué tan protegida está la confidencialidad de una base de datos Oracle y vea cómo mejora con el tiempo.</p><ul><li>15 comprobaciones automáticas basadas en ISO 27001/27002</li><li>Informes claros para personas no técnicas</li><li>Historial y gráficos de avance por empresa</li></ul></div>
<div class="form"><div><div class="tabs"><button class="${S.modo=='login'?'on':''}" onclick="S.modo='login';S.msg='';draw()">Ingresar</button><button class="${S.modo=='register'?'on':''}" onclick="S.modo='register';S.msg='';draw()">Crear cuenta</button></div>
<h2>${S.modo=='login'?'Bienvenida de nuevo':'Cree su cuenta'}</h2><p class="sub">${S.modo=='login'?'Ingrese con su correo y contraseña.':'Solo la primera vez. Sus datos se guardan en este computador.'}</p>
<label>Correo<input id="em" type="email" autocomplete="username"></label><label>Contraseña (mínimo 8 caracteres)<input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')auth()"></label>
<p class="err">${E(S.msg)}</p><button style="width:100%" onclick="auth()">${S.modo=='login'?'Ingresar':'Crear cuenta e ingresar'}</button></div></div></div>`;
async function auth(){try{S.me=(await api('/api/'+S.modo,'POST',{email:$('#em').value,password:$('#pw').value})).email;S.msg='';await load()}catch(e){S.msg=e.message}draw()}
async function out(){await api('/api/logout','POST');S={me:null,emps:[],eid:null,evs:[],ev:null,cat:null,v:'resumen',msg:'',modo:'login',open:{},busy:false,conn:''};draw()}
/* ---------- estructura ---------- */
const NAV=[['resumen','Resumen'],['evaluar','Nueva evaluación'],['historial','Historial'],['informe','Informe'],['consultas','Consultas SQL'],['riesgos','Riesgos y tareas'],['guia','Guía']];
function shell(){const V={resumen,evaluar,historial,informe,consultas,riesgos,guia,empresa}[S.v]||resumen;
return `<div class="app"><aside><div class="logo">ConfiDBA Studio<small>Confidencialidad en bases Oracle</small></div>
<select onchange="pick(this.value)" aria-label="Empresa">${S.emps.map(e=>`<option value="${e.id}" ${e.id==S.eid?'selected':''}>${E(e.nombre)}</option>`).join('')||'<option>(sin empresas)</option>'}</select>
<button class="nav" onclick="go('empresa')">+ Nueva empresa</button>${NAV.map(n=>`<button class="nav ${S.v==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}
<div class="who">${E(S.me)}<br><button class="g" style="margin-top:6px;padding:5px 12px" onclick="out()">Salir</button></div></aside><main>${V()}</main></div>`}
async function pick(v){S.eid=+v;await loadEvs();draw()}
/* ---------- gráficos ---------- */
const pol=(p,r)=>{const a=Math.PI*(1-p/100);return[110+r*Math.cos(a),110-r*Math.sin(a)]};
const arc=(a,b,c)=>{const[x1,y1]=pol(a,90),[x2,y2]=pol(b,90);return`<path d="M${x1} ${y1}A90 90 0 0 1 ${x2} ${y2}" stroke="${c}" stroke-width="18" fill="none"/>`};
function gauge(p){const[x,y]=pol(p??0,68),z=Z(p);return`<svg viewBox="0 0 220 135" style="width:100%;max-width:250px">${arc(0,30,'#C8432F')}${arc(30,70,'#D9A21B')}${arc(70,100,'#2F8F5B')}<line x1="110" y1="110" x2="${x}" y2="${y}" stroke="#10202C" stroke-width="4" stroke-linecap="round"/><circle cx="110" cy="110" r="7" fill="#10202C"/><text x="110" y="132" text-anchor="middle" font-size="22" font-weight="700" fill="${z[1]}">${p??'—'}%</text></svg>`}
function line(v){v=v.filter(x=>x.rc!=null);if(!v.length)return'<p class="sub">Aún no hay evaluaciones.</p>';const W=680,H=210,L=38,x=i=>L+(v.length<2?300:i*(W-L-24)/(v.length-1)),y=p=>H-26-p*(H-46)/100;
return`<svg viewBox="0 0 ${W} ${H}" style="width:100%"><rect x="${L}" y="${y(30)}" width="${W-L-10}" height="${y(0)-y(30)}" fill="#C8432F1f"/><rect x="${L}" y="${y(70)}" width="${W-L-10}" height="${y(30)-y(70)}" fill="#D9A21B1f"/><rect x="${L}" y="${y(100)}" width="${W-L-10}" height="${y(70)-y(100)}" fill="#2F8F5B1f"/>
${[0,30,70,100].map(p=>`<text x="4" y="${y(p)+4}" font-size="11" fill="#5B6C78">${p}%</text>`).join('')}<polyline fill="none" stroke="#10202C" stroke-width="2.6" points="${v.map((e,i)=>x(i)+','+y(e.rc)).join(' ')}"/>
${v.map((e,i)=>`<circle cx="${x(i)}" cy="${y(e.rc)}" r="5.5" fill="${Z(e.rc)[1]}" stroke="#10202C" stroke-width="1.5"/><text x="${x(i)}" y="${y(e.rc)-10}" font-size="11.5" font-weight="700" text-anchor="middle">${e.rc}</text><text x="${x(i)}" y="${H-6}" font-size="10.5" fill="#5B6C78" text-anchor="middle">${e.fecha.slice(5,10)}</text>`).join('')}</svg>`}
const rbars=c=>c.riesgos.map(r=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${E(r.nombre)}</span><span><s style="color:#8A98A3">${r.inh}</s> → <b>${r.res??'—'}</b></span></div><div class="bar"><i style="width:${r.inh/25*100}%;background:#C5D0D8;height:5px;border-radius:0"></i><i style="width:${(r.res||0)/25*100}%;background:${Z(r.rc)[1]}"></i></div></div>`).join('');
const ctlbars=d=>d.map(x=>{const v=x.manual==='NA'?null:(x.manual!=null?x.manual:x.auto);return`<div style="display:flex;gap:8px;align-items:center;font-size:13px;margin:4px 0"><span style="width:44px;color:#5B6C78">${x.id}</span><div class="bar" style="flex:1"><i style="width:${(v||0)*100}%;background:${v==null?'#8A98A3':v>=1?'#2F8F5B':v>0?'#D9A21B':'#C8432F'}"></i></div><span style="width:34px;text-align:right">${v==null?'n/a':Math.round(v*100)+'%'}</span></div>`}).join('');
/* ---------- vistas ---------- */
function resumen(){const e=S.ev;if(!emp())return empresa();
if(!e)return`<h1>${E(emp().nombre)}</h1><p class="sub">Todavía no hay evaluaciones.</p><div class="card"><h2>Empiece en 3 pasos</h2><div class="step"><b>1</b><div>Vaya a <b>Nueva evaluación</b>. Si aún no tiene la base lista, use el <b>modo demostración</b> para ver cómo funciona (los datos son simulados).</div></div><div class="step"><b>2</b><div>Revise el <b>Informe</b>: verá qué controles se cumplen, qué falló y qué sugerimos.</div></div><div class="step"><b>3</b><div>Repita la evaluación después de corregir cosas: en <b>Historial</b> verá cómo sube el cumplimiento.</div></div><button onclick="go('evaluar')">Hacer mi primera evaluación</button></div>`;
const c=e.calc,z=Z(c.rc);return`<h1>${E(emp().nombre)}</h1><p class="sub">Última evaluación: ${E(e.fecha.replace('T',' '))} ${e.modo=='demo'?'· <b>datos simulados</b>':''}</p>
<div class="g2"><div class="card" style="text-align:center"><h2>Cumplimiento</h2>${gauge(c.rc)}<div><span class="pill" style="background:${z[1]}">Zona ${z[0]}</span></div></div>
<div class="card"><h2>En palabras simples</h2><p>${E(e.resumen)}</p><div class="row" style="margin-top:14px;flex-wrap:nowrap"><div class="stat" style="min-width:0"><b style="color:#2F8F5B">${c.ok}</b><span>cumplen</span></div><div class="stat"><b style="color:#D9A21B">${c.parcial}</b><span>parciales</span></div><div class="stat"><b style="color:#C8432F">${c.falla}</b><span>no cumplen</span></div></div><button style="margin-top:12px" onclick="go('informe')">Ver informe completo</button></div></div>
<div class="g2" style="margin-top:16px"><div class="card"><h2>Riesgo antes y después de los controles</h2><p class="sub" style="margin:0">Gris: riesgo sin controles. Color: riesgo que queda hoy.</p>${rbars(c)}</div><div class="card"><h2>Evolución</h2>${line(S.evs)}</div></div>`}
function empresa(){return`<h1>${S.emps.length?'Nueva empresa':'Cree su primera empresa'}</h1><p class="sub">Una "empresa" agrupa todas las evaluaciones de una misma base de datos para ver su avance en el tiempo.</p>
<div class="card" style="max-width:640px"><label>Nombre de la empresa<input id="ne" placeholder="Ej: Cooperativa Los Ángeles"></label><label>Esquema a evaluar<input id="ns" placeholder="CONFI_LAB"></label>
<div class="help"><b>¿Qué es el esquema?</b> En Oracle, un esquema es el "espacio" de un usuario donde viven sus tablas (cada usuario tiene el suyo). La app revisa en ese esquema si las columnas sensibles (cédula, tarjeta, salario…) están clasificadas, enmascaradas o protegidas. Si usó nuestro laboratorio, déjelo en <b>CONFI_LAB</b>. Para otra base, escriba el usuario dueño de las tablas importantes.</div>
<p class="err">${E(S.msg)}</p><button onclick="newEmp()">Crear empresa</button></div>`}
async function newEmp(){const n=$('#ne').value.trim();if(!n){S.msg='Escriba un nombre.';draw();return}await api('/api/empresas','POST',{nombre:n,esquema:$('#ns').value.trim()});S.emps=await api('/api/empresas');S.eid=S.emps[S.emps.length-1].id;await loadEvs();S.v='evaluar';S.msg='';draw()}
function evaluar(){if(!emp())return empresa();return`<h1>Nueva evaluación</h1><p class="sub">Se ejecutan las 15 comprobaciones sobre <b>${E(emp().nombre)}</b> (esquema ${E(emp().esquema)}) y se guarda el resultado con la fecha de hoy.</p>
<div class="card"><label><input type="radio" name="md" value="demo" onchange="$('#cn').style.display='none'"> <b>Modo demostración</b>: datos simulados, para conocer la herramienta sin conectar nada</label>
<label><input type="radio" name="md" value="real" checked onchange="$('#cn').style.display='block'"> <b>Conectar a una base Oracle</b> (en este computador o en otro)</label>
<div id="cn"><div class="row"><label>Servidor<input id="h" value="localhost"></label><label>Puerto<input id="p" value="1521"></label><label>Servicio (PDB)<input id="sv" value="XEPDB1"></label></div>
<div class="row"><label>Usuario<input id="us" value="confi_auditor"></label><label>Contraseña (no se guarda)<input id="pa" type="password"></label><button class="g" onclick="probar()">Probar conexión</button></div>
<div class="help">El usuario <b>confi_auditor</b> se crea con <code>sql/02_usuario_auditor.sql</code>. Solo puede leer información de seguridad, no modifica nada.</div><p id="cm" class="${S.conn.startsWith('✔')?'ok':'err'}">${E(S.conn)}</p></div>
<p class="err">${E(S.msg)}</p><button id="go" onclick="runEv()" ${S.busy?'disabled':''}>${S.busy?'Evaluando…':'Ejecutar evaluación'}</button></div>`}
const cred=()=>({host:$('#h').value,port:$('#p').value,service:$('#sv').value,user:$('#us').value,password:$('#pa').value});
async function probar(){S.conn='Probando…';$('#cm').textContent=S.conn;$('#cm').className='';try{const r=await api('/api/probar','POST',cred());S.conn='✔ Conexión exitosa: '+r.banner}catch(e){S.conn='✘ '+e.message}$('#cm').textContent=S.conn;$('#cm').className=S.conn.startsWith('✔')?'ok':'err'}
async function runEv(){const md=document.querySelector('[name=md]:checked').value,b=md=='demo'?{modo:'demo'}:{modo:'real',...cred()};S.busy=true;S.msg='';draw();
try{const r=await api(`/api/empresas/${S.eid}/run`,'POST',b);await loadEvs();S.v='informe'}catch(e){S.msg=e.message}S.busy=false;draw()}
function historial(){if(!emp())return empresa();const v=S.evs.filter(x=>x.rc!=null),f=v[0],l=v[v.length-1];
return`<h1>Historial de ${E(emp().nombre)}</h1><p class="sub">Cada evaluación queda guardada con su fecha. Rojo 0–30 %, amarillo 30–70 %, verde 70–100 %.</p>
<div class="card"><h2>Evolución del cumplimiento</h2>${line(S.evs)}${v.length>1?`<p><b>Avance:</b> de ${f.rc}% a ${l.rc}% (${(l.rc-f.rc>=0?'+':'')+(l.rc-f.rc).toFixed(1)} puntos) en ${v.length} evaluaciones.</p>`:''}</div>
<div class="card w"><table><thead><tr><th>Fecha</th><th>Origen</th><th>Cumplimiento</th><th></th></tr></thead><tbody>${S.evs.slice().reverse().map(e=>`<tr><td>${E(e.fecha.replace('T',' '))}</td><td>${e.modo=='demo'?'Simulado':'Base real'}</td><td><span class="pill" style="background:${Z(e.rc)[1]}">${e.rc??'—'}% · ${Z(e.rc)[0]}</span></td><td><button class="g" onclick="openEv(${e.id})">Ver informe</button></td></tr>`).join('')||'<tr><td colspan="4">Sin evaluaciones todavía.</td></tr>'}</tbody></table></div>`}
async function openEv(i){S.ev=await api('/api/evals/'+i);go('informe')}
function informe(){const e=S.ev;if(!e)return'<h1>Informe</h1><div class="card">Ejecute una evaluación para ver su informe.</div>';const c=e.calc,z=Z(c.rc);
return`<h1>Informe de ${E(e.empresa)}</h1><p class="sub">${E(e.fecha.replace('T',' '))}</p>${e.modo=='demo'?'<div class="note">Datos simulados del modo demostración: no representan una base real.</div>':''}
<div class="g2"><div class="card" style="text-align:center">${gauge(c.rc)}<span class="pill" style="background:${z[1]}">Zona ${z[0]}</span></div><div class="card"><h2>Resumen</h2><p>${E(e.resumen)}</p><p class="sub" style="margin:0">${c.ok} cumplen · ${c.parcial} parciales · ${c.falla} no cumplen (de ${c.n} evaluados)</p><div class="noprint row" style="margin-top:12px"><button onclick="print()">Imprimir / guardar PDF</button><button class="g" onclick="csv()">Descargar CSV</button></div></div></div>
<div class="g2" style="margin-top:16px"><div class="card"><h2>Riesgo de confidencialidad</h2><p class="sub" style="margin:0">Residual = inherente × (1 − cumplimiento de sus controles)</p>${rbars(c)}</div><div class="card"><h2>Cumplimiento por control</h2>${ctlbars(e.det)}</div></div>
<div class="card w" style="margin-top:16px"><h2>Controles, evidencia y ajuste del DBA</h2><p class="sub" style="margin:0 0 8px">El resultado automático se puede corregir. Cada cambio queda guardado.</p><table><thead><tr><th>Control</th><th>Peso</th><th>Resultado</th><th>Hallazgo</th></tr></thead><tbody>${e.det.map(d=>{const v=d.manual!=null?d.manual:d.auto,ev=S.cat?.ch.find(k=>k.id==d.id);
return`<tr><td><b>${d.id}</b> ${E(d.nombre)}<br><small style="color:#5B6C78">${E(d.explica)}</small></td><td><input type="number" min="1" value="${d.peso}" style="width:68px" onchange="up('${d.id}',{peso:this.value})"></td>
<td><select onchange="up('${d.id}',{manual:this.value==='auto'?null:this.value==='NA'?'NA':+this.value})">${[['auto','Automático ('+(d.auto==null?'n/a':d.auto)+')'],[1,'Cumple (1)'],[0.5,'Parcial (0.5)'],[0,'No cumple (0)'],['NA','No aplica']].map(o=>`<option value="${o[0]}" ${(d.manual==null&&o[0]=='auto')||d.manual==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></td>
<td class="${d.error?'err':''}">${E(d.hallazgo)}${v!=='NA'&&(v==null?0:v)<1?`<br><i style="color:#23424A">Sugerencia: ${E(d.sug)}</i>`:''}<br><input placeholder="Nota del DBA" value="${E(d.nota)}" onchange="up('${d.id}',{nota:this.value})" style="margin-top:4px">
${d.filas&&d.filas.length?`<br><a href="#" onclick="S.open['${d.id}']=!S.open['${d.id}'];draw();return false">${S.open[d.id]?'Ocultar':'Ver'} evidencia (resultado de la consulta)</a>`:''}${S.open[d.id]&&d.filas?d.filas.map(f=>`<div class="w" style="margin-top:6px"><table><thead><tr>${f.cols.map(c=>`<th>${E(c)}</th>`).join('')}</tr></thead><tbody>${f.rows.map(r=>`<tr>${r.map(c=>`<td>${E(c)}</td>`).join('')}</tr>`).join('')||'<tr><td>(sin filas)</td></tr>'}</tbody></table></div><small>${f.n} fila(s)${f.n>10?', se muestran 10':''}</small>`).join(''):''}</td></tr>`}).join('')}</tbody></table></div>`}
async function up(id,b){S.ev=await api('/api/evals/'+S.ev.id,'PATCH',{id,...b});S.evs=await api(`/api/empresas/${S.eid}/evals`);draw()}
function csv(){const e=S.ev,r=[['Control','Nombre','Peso','Resultado','Hallazgo','Nota']].concat(e.det.map(d=>[d.id,d.nombre,d.peso,d.manual!=null?d.manual:d.auto,d.hallazgo,d.nota]));
const t='\ufeff'+r.map(x=>x.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='evaluacion_'+e.fecha.slice(0,10)+'.csv';a.click()}
const sqlOf=c=>c.sql.map(q=>q.replace(/:s/g,"'"+(emp()?emp().esquema:'CONFI_LAB').toUpperCase()+"'")+';').join('\n\n');
function consultas(){if(!S.cat)return'';return`<h1>Consultas SQL de verificación</h1><p class="sub">Estas son las consultas que la app ejecuta. También puede correrlas a mano en SQL Developer para sacar la evidencia (captura de pantalla) de cada control.</p>
<div class="card"><button onclick="cp(-1,this)">Copiar las 15 consultas</button></div>${S.cat.ch.map((c,i)=>`<div class="card"><h2>${c.id} · ${E(c.nombre)}</h2><p style="margin:0">${E(c.explica)}</p><pre>${E(sqlOf(c))}</pre><button class="g" onclick="cp(${i},this)">Copiar SQL</button>
<table style="margin-top:10px"><tbody><tr><th style="width:170px">Resultado esperado</th><td>${E(c.esp||'')}</td></tr><tr><th>Lo que ve un auditor</th><td>${E(c.obs||'')}</td></tr><tr><th>Cómo implementarlo</th><td>${E(c.imp||'')}</td></tr><tr><th>Herramienta</th><td>${E(c.tool||'')}</td></tr></tbody></table></div>`).join('')}`}
async function cp(i,b){const t=i<0?S.cat.ch.map(c=>'-- '+c.id+' '+c.nombre+'\n'+sqlOf(c)).join('\n\n'):sqlOf(S.cat.ch[i]);try{await navigator.clipboard.writeText(t);b.textContent='¡Copiado!'}catch(e){b.textContent='Seleccione y copie manualmente'}setTimeout(()=>b.textContent=i<0?'Copiar las 15 consultas':'Copiar SQL',1600)}
function riesgos(){if(!S.cat)return'';const lv=v=>v>=13?'#C8432F':v>=7?'#D9A21B':'#2F8F5B';let g='';for(let I=5;I>=1;I--)for(let P=1;P<=5;P++){const v=I*P;g+=`<div class="cell" style="background:color-mix(in srgb,${lv(v)} ${22+v*2.4}%,#fff)">${S.cat.ries.map((r,k)=>r.i==I&&r.p==P?`<span style="background:#10202C;color:#fff;border-radius:4px;padding:0 5px">R${k+1}</span>`:'').join('')}</div>`}
return`<h1>Riesgos, tareas y segregación de funciones</h1><p class="sub">El marco que sustenta la evaluación: qué puede salir mal, qué hace el DBA y cómo se separan las funciones.</p>
<div class="g2"><div class="card"><h2>Mapa de calor (impacto × probabilidad)</h2><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:340px">${g}</div><p class="sub" style="margin:8px 0 0">Filas: impacto 5 a 1. Columnas: probabilidad 1 a 5.</p></div>
<div class="card w"><h2>Riesgos de confidencialidad</h2><table><thead><tr><th>Riesgo</th><th>I×P</th><th>Controles</th></tr></thead><tbody>${S.cat.ries.map(r=>`<tr><td><b>${r.id}</b> ${E(r.nombre)}</td><td>${r.i}×${r.p}=${r.inh}</td><td>${E(r.ctl.join(', '))}</td></tr>`).join('')}</tbody></table></div></div>
<div class="card w" style="margin-top:16px"><h2>12 tareas críticas del DBA</h2><table><thead><tr><th>ID</th><th>Tarea</th><th>Riesgo</th><th>Control</th><th>Evidencia</th></tr></thead><tbody>${S.cat.tareas.map(t=>`<tr><td>${t[0]}</td><td>${E(t[1])}</td><td>R-CONF-0${t[2]+1}</td><td>${E(t[3])}</td><td>${E(t[4])}</td></tr>`).join('')}</tbody></table></div>
<div class="card w"><h2>Segregación de funciones</h2><p class="sub" style="margin:0 0 8px">Nadie debe poder hacer su trabajo y también ocultarlo.</p><table><thead><tr><th>Función</th><th>Puede</th><th>No debe poder</th><th>Cómo se logra</th></tr></thead><tbody>${S.cat.sod.map(r=>`<tr>${r.map(c=>`<td>${E(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const guia=()=>`<h1>Guía rápida</h1><p class="sub">Para probar la app y para explicarla.</p>
<div class="card"><h2>Probarla en 5 minutos</h2><div class="step"><b>1</b><div>Cree la empresa (menú lateral → + Nueva empresa).</div></div><div class="step"><b>2</b><div>En <b>Nueva evaluación</b> elija <b>Modo demostración</b> y ejecute. Repítalo 2 o 3 veces.</div></div><div class="step"><b>3</b><div>Mire <b>Resumen</b>, <b>Informe</b> e <b>Historial</b>: verá el indicador, los gráficos y la línea de avance.</div></div><div class="step"><b>4</b><div>En el Informe cambie un resultado a mano y vea cómo se recalcula el cumplimiento.</div></div><div class="step"><b>5</b><div>Para una base real: encienda Oracle, ejecute <code>sql/00_laboratorio_XE21c.sql</code> y <code>sql/02_usuario_auditor.sql</code>, y use <b>Probar conexión</b>.</div></div></div>
<div class="card"><h2>Conceptos</h2><table><tbody><tr><th style="width:190px">Control</th><td>Una medida de seguridad concreta (por ejemplo, cifrar los datos o auditar los accesos).</td></tr><tr><th>Control observable</th><td>Se puede comprobar con una consulta o configuración, sin depender de la palabra de nadie.</td></tr><tr><th>Cumplimiento</th><td>Suma de (valor de cada control × su peso) entre la suma de pesos. Cada control vale 0 a 1.</td></tr><tr><th>Riesgo inherente</th><td>El riesgo sin ningún control (impacto × probabilidad).</td></tr><tr><th>Riesgo residual</th><td>Lo que queda después de los controles: inherente × (1 − cumplimiento).</td></tr><tr><th>Esquema</th><td>El espacio de un usuario en Oracle donde están sus tablas.</td></tr><tr><th>Zonas</th><td>Rojo 0–30 %, amarillo 30–70 %, verde 70–100 %.</td></tr><tr><th>¿Se guarda todo?</th><td>Sí: cuentas, empresas, evaluaciones, ajustes y notas quedan en el archivo confidba.db de la carpeta de la app.</td></tr></tbody></table></div>`;
